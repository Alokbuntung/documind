<!-- === [TAG TEMPLATE: Halaman Reset Kata Sandi (reset_password.html)] === -->
<!-- Penjelasan: Antarmuka pembuatan kata sandi baru menggunakan token verifikasi reset yang dikirim ke email pengguna -->
{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface dark:bg-inverse-surface rounded-3xl shadow-2xl p-8 border border-outline-variant animate-in fade-in zoom-in duration-300">
        <!-- Logo & Branding -->
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mb-4 shadow-inner ring-1 ring-primary/20">
                <span class="material-symbols-outlined text-primary text-4xl">lock_reset</span>
            </div>
            <h1 class="text-display-sm font-display-sm font-bold text-on-surface tracking-tight" id="auth-title">Buat Password Baru</h1>
            <p class="text-body-md font-body-md text-on-surface-variant mt-2 text-center" id="auth-subtitle">Masukkan password baru untuk akun {{ email }}</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="reset-alert" class="hidden mb-6 p-4 rounded-xl text-sm font-medium animate-in fade-in slide-in-from-top-2 duration-300"></div>

        <!-- === [TAG FORMULIR: Pembaruan Kata Sandi Baru (New Password Form)] === -->
        <!-- Penjelasan: Input kata sandi baru dan konfirmasi kata sandi dengan token verifikasi hidden input -->
        <form action="javascript:void(0);" method="POST" class="space-y-4" id="new-password-form">
            <input type="hidden" id="reset-token" value="{{ token }}" />
            
            <!-- New Password Field -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2" for="new-password">Password Baru</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-outline text-[20px]">lock</span>
                    </div>
                    <input class="block w-full pl-11 pr-11 py-2.5 bg-surface-container-lowest border border-outline-variant/80 rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline/70 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm font-medium" id="new-password" name="new_password" placeholder="Minimal 6 karakter" required="" type="password"/>
                    <button type="button" class="toggle-pw-visibility absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" data-target="new-password">
                        <span class="material-symbols-outlined text-[18px]">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password Field -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2" for="confirm-password">Konfirmasi Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-outline text-[20px]">check_circle</span>
                    </div>
                    <input class="block w-full pl-11 pr-11 py-2.5 bg-surface-container-lowest border border-outline-variant/80 rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline/70 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm font-medium" id="confirm-password" name="confirm_password" placeholder="Ulangi password baru" required="" type="password"/>
                    <button type="button" class="toggle-pw-visibility absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" data-target="confirm-password">
                        <span class="material-symbols-outlined text-[18px]">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button class="w-full flex justify-center items-center py-3 px-4 mt-2 rounded-xl shadow-lg shadow-primary/25 text-sm font-bold text-on-primary bg-primary hover:bg-[#4338CA] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all hover:-translate-y-0.5 active:scale-[0.98] cursor-pointer" type="submit" id="submit-btn">
                Simpan Password Baru
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="text-center mt-6">
            <a href="{{ url_for('main.login') }}" class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors">Batal dan kembali ke Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- === [TAG SKRIP: Validasi & Penyimpanan Kata Sandi Baru] === -->
<!-- Penjelasan: Logika toggle visibilitas password, validasi kecocokan kedua password, dan pengiriman AJAX ke /api/auth/reset-password/<token> -->
<script>
    // Password visibility toggle logic
    document.querySelectorAll('.toggle-pw-visibility').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = document.getElementById(btn.dataset.target);
            if (!target) return;
            const isPassword = target.type === 'password';
            target.type = isPassword ? 'text' : 'password';
            btn.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility' : 'visibility_off';
        });
    });

    const form = document.getElementById('new-password-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('reset-alert');

    function showAlert(msg, type) {
        if (!alertBox) return;
        alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-200', 'bg-emerald-100', 'text-emerald-700', 'border-emerald-200');
        if (type === 'error') {
            alertBox.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-200');
        } else {
            alertBox.classList.add('bg-emerald-100', 'text-emerald-700', 'border', 'border-emerald-200');
        }
        alertBox.textContent = msg;
    }

    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('reset-token').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showAlert('Password dan konfirmasi tidak cocok.', 'error');
                return;
            }
            if (newPassword.length < 6) {
                showAlert('Password minimal 6 karakter.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Menyimpan...</span>
            `;

            try {
                // Gunakan apiFetch bawaan sistem untuk menambahkan CSRF Token secara transparan
                const res = await (typeof apiFetch !== 'undefined' ? apiFetch : fetch)(`/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = "{{ url_for('main.login') }}";
                    }, 2000);
                } else {
                    showAlert(data.message || 'Gagal menyimpan password baru.', 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert('Terjadi kesalahan koneksi.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan Password Baru';
            }
        });
    }
</script>
{% endblock %}
